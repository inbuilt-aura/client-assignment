services:
  api:
    build: .
    container_name: nova-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://nova:nova@db:5432/nova
      DEMO_AUTH_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GEOCODING_PROVIDER: nominatim
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      GEOCODING_USER_AGENT: "NOVA-Vendor-Coverage/0.1 (service-area location search)"
      AUTH_SECRET: ${AUTH_SECRET:-nova-demo-secret-change-before-deployment}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
